name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (pure Rust, no Python)
        run: cargo test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # PyO3 0.20 supports CPython <= 3.12
      - name: Build + install the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release
          pip install target/wheels/*.whl
      - name: Smoke test + offline benchmark
        run: |
          cd /tmp && python -c 'import blazetok; t=blazetok.Tokenizer(); t.train("hello hello", 260); print(t.decode(t.encode("hello")))'
          cd $GITHUB_WORKSPACE/bench && python compare_offline.py
