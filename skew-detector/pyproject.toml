[project]
name = "skew-detector"
version = "0.1.0"
description = "Training-serving skew detector: schema diff, KS, PSI, label-prevalence shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click>=8.0", "pandas>=2.0", "scipy>=1.10", "numpy>=1.24", "rich>=13.0"]

[project.scripts]
skew-detect = "skew_detect.cli:main"

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skew_detect"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
