[project]
name = "tiny-vec"
version = "0.1.0"
description = "Linear algebra and autograd from first principles, benchmarked vs NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kashyapphassan2000-netizen" }]
dependencies = []

[project.optional-dependencies]
dev = ["numpy", "pytest", "pytest-cov", "hypothesis", "scikit-learn", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_vec"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
